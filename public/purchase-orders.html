<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot — Purchase Orders</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Global Layout Wrapper -->
  <div id="app-layout">
    <div id="navbar-placeholder"></div>

    <div id="main-wrapper">
      <main id="content-area">
        <!-- Page Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
          <div>
            <h1 class="page-title">Purchase Orders</h1>
            <p class="page-subtitle">Procurement lifecycle, vendor replenishment, and warehouse receiving dock</p>
          </div>
          <div>
            <button class="btn btn-sm btn-primary" onclick="openCreatePoModal()">
              <i data-lucide="plus"></i>
              <span>Create Purchase Order</span>
            </button>
          </div>
        </div>

        <!-- Filter Controls Bar -->
        <div class="sp-card mb-3">
          <div class="sp-card-body p-3">
            <div class="row g-2 align-items-center">
              <div class="col-md-4">
                <select id="po-status-filter" class="form-select form-select-sm" onchange="loadPurchaseOrders()">
                  <option value="">All Statuses</option>
                  <option value="DRAFT">DRAFT</option>
                  <option value="SUBMITTED">SUBMITTED (In-Flight)</option>
                  <option value="PARTIALLY_RECEIVED">PARTIALLY RECEIVED</option>
                  <option value="RECEIVED">RECEIVED (Completed)</option>
                  <option value="CANCELLED">CANCELLED</option>
                </select>
              </div>
              <div class="col-md-5">
                <select id="po-supplier-filter" class="form-select form-select-sm" onchange="loadPurchaseOrders()">
                  <option value="">All Suppliers</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Purchase Orders Table Card -->
        <div class="sp-card">
          <div id="po-loading" class="spinner-overlay d-none">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          </div>

          <div class="table-responsive">
            <table class="sp-table align-middle" id="po-table">
              <thead>
                <tr>
                  <th style="width: 140px;">PO Number</th>
                  <th>Supplier</th>
                  <th>Status</th>
                  <th>Order Date</th>
                  <th class="num text-center">Items</th>
                  <th class="num text-center">Ordered Qty</th>
                  <th class="num text-center">Received Qty</th>
                  <th class="num text-end">Total Amount</th>
                  <th class="text-end" style="width: 130px;">Action</th>
                </tr>
              </thead>
              <tbody id="po-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Purchase Order Modal -->
  <div class="modal fade" id="createPoModal" tabindex="-1" aria-labelledby="createPoTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="create-po-form">
          <div class="modal-header py-2 px-3 border-bottom">
            <h6 class="modal-title fw-bold" id="createPoTitle">Create New Purchase Order</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-3">
            <div id="po-create-error" class="alert alert-danger d-none py-2 px-3 mb-3 small"></div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold" for="po-supplier-input">Vendor / Supplier <span class="text-danger">*</span></label>
                <select id="po-supplier-input" class="form-select form-select-sm" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold" for="po-expected-date">Expected Delivery Date</label>
                <input type="date" id="po-expected-date" class="form-control form-control-sm">
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="small fw-semibold">Order Line Items</span>
              <button type="button" class="btn btn-sm btn-secondary" onclick="addPoItemRow()">
                <i data-lucide="plus"></i> Add Item Line
              </button>
            </div>

            <div class="table-responsive mb-3">
              <table class="table table-sm align-middle mb-0" id="po-items-table">
                <thead class="table-light">
                  <tr>
                    <th style="width: 55%;">Product</th>
                    <th class="num text-center" style="width: 20%;">Qty</th>
                    <th class="num text-end" style="width: 20%;">Unit Cost ($)</th>
                    <th style="width: 5%;"></th>
                  </tr>
                </thead>
                <tbody id="po-items-tbody"></tbody>
              </table>
            </div>

            <div class="d-flex justify-content-end align-items-center gap-2 border-top pt-2">
              <span class="text-secondary small">Estimated Total:</span>
              <span class="fs-5 fw-bold font-mono text-primary" id="po-total-display">$0.00</span>
            </div>
          </div>
          <div class="modal-footer py-2 px-3 border-top">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary">Create Draft PO</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- PO Manage / Details Modal -->
  <div class="modal fade" id="poDetailsModal" tabindex="-1" aria-labelledby="details-po-title" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header py-2 px-3 border-bottom">
          <h6 class="modal-title fw-bold" id="details-po-title">Purchase Order Details</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-3" id="details-po-body"></div>
        <div class="modal-footer py-2 px-3 border-top">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/purchase-orders.js"></script>
</body>
</html>
