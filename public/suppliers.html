<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot — Suppliers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Global Layout Wrapper -->
  <div id="app-layout">
    <div id="navbar-placeholder"></div>

    <div id="main-wrapper">
      <main id="content-area">
        <!-- Page Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
          <div>
            <h1 class="page-title">Commercial Suppliers</h1>
            <p class="page-subtitle">Vendor directory, lead times, and fulfillment profiles</p>
          </div>
          <div>
            <button id="btn-add-supplier" class="btn btn-sm btn-primary" onclick="openAddSupplierModal()">
              <i data-lucide="plus"></i>
              <span>Add Supplier</span>
            </button>
          </div>
        </div>

        <!-- Suppliers Table Card -->
        <div class="sp-card">
          <div id="suppliers-loading" class="spinner-overlay d-none">
            <div class="spinner-border spinner-border-sm text-primary" role="status">
              <span class="visually-hidden">Loading suppliers...</span>
            </div>
          </div>

          <div id="suppliers-empty" class="d-none text-center py-5">
            <i data-lucide="truck" class="text-muted mb-2" style="width:36px;height:36px;"></i>
            <h6 class="fw-semibold text-muted">No suppliers found</h6>
          </div>

          <div class="table-responsive">
            <table id="suppliers-table" class="sp-table align-middle d-none">
              <thead>
                <tr>
                  <th style="width: 220px;">Supplier Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Address</th>
                  <th class="num text-center" style="width: 130px;">Lead Time</th>
                  <th class="text-end" style="width: 100px;">Actions</th>
                </tr>
              </thead>
              <tbody id="suppliers-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Supplier Modal -->
  <div class="modal fade" id="supplierModal" tabindex="-1" aria-labelledby="supplier-modal-title" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="supplier-form">
          <div class="modal-header py-2 px-3 border-bottom">
            <h6 class="modal-title fw-bold" id="supplier-modal-title">Supplier</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-3">
            <div id="supplier-error-alert" class="alert alert-danger d-none py-2 px-3 mb-3 small"></div>
            <input type="hidden" id="supplier-id">

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="sup-name">Supplier Name <span class="text-danger">*</span></label>
              <input type="text" id="sup-name" class="form-control form-control-sm" required placeholder="e.g. Apex Global Distributors">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="sup-email">Contact Email</label>
              <input type="email" id="sup-email" class="form-control form-control-sm" placeholder="orders@supplier.com">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="sup-phone">Phone Number</label>
              <input type="text" id="sup-phone" class="form-control form-control-sm" placeholder="+1-800-555-0199">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="sup-address">Business Address</label>
              <input type="text" id="sup-address" class="form-control form-control-sm" placeholder="100 Logistics Blvd, City, State">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="sup-lead">Default Lead Time (Days) <span class="text-danger">*</span></label>
              <input type="number" min="0" id="sup-lead" class="form-control form-control-sm tabular-nums" value="7" required>
            </div>
          </div>
          <div class="modal-footer py-2 px-3 border-top">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="save-supplier-btn" class="btn btn-sm btn-primary">Save Supplier</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/suppliers.js"></script>
</body>
</html>
