<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot - Suppliers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container"></div>
  <div id="navbar-placeholder"></div>

  <main class="container-fluid py-4 px-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div>
        <h2 class="fw-bold mb-0">Commercial Suppliers</h2>
        <p class="text-muted mb-0">Vendor directory, lead times, and fulfillment profiles</p>
      </div>
      <div>
        <button id="btn-add-supplier" class="btn btn-primary" onclick="openAddSupplierModal()">
          <span class="me-1">+</span> Add Supplier
        </button>
      </div>
    </div>

    <div class="card overflow-hidden">
      <div id="suppliers-loading" class="spinner-overlay">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading suppliers...</span>
        </div>
      </div>

      <div id="suppliers-empty" class="d-none text-center p-5">
        <h5 class="fw-semibold">No suppliers found</h5>
      </div>

      <div class="table-responsive">
        <table id="suppliers-table" class="table table-hover align-middle mb-0 d-none">
          <thead>
            <tr>
              <th>Supplier Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Address</th>
              <th class="text-center">Lead Time</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="suppliers-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Supplier Modal -->
  <div class="modal fade" id="supplierModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="supplier-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="supplier-modal-title">Supplier</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div id="supplier-error-alert" class="alert alert-danger d-none"></div>
            <input type="hidden" id="supplier-id">

            <div class="mb-3">
              <label class="form-label fw-semibold">Supplier Name *</label>
              <input type="text" id="sup-name" class="form-control" required placeholder="e.g. Apex Global Distributors">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Contact Email</label>
              <input type="email" id="sup-email" class="form-control" placeholder="orders@supplier.com">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="text" id="sup-phone" class="form-control" placeholder="+1-800-555-0199">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Business Address</label>
              <input type="text" id="sup-address" class="form-control" placeholder="100 Logistics Blvd, City, State">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Default Lead Time (Days) *</label>
              <input type="number" min="0" id="sup-lead" class="form-control" value="7" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="save-supplier-btn" class="btn btn-primary fw-semibold">Save Supplier</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/suppliers.js"></script>
</body>
</html>
