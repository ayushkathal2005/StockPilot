<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot — Sign In</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background-color: var(--sp-bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
  <!-- Toast Container -->
  <div id="toast-container"></div>

  <div style="width: 100%; max-width: 420px;">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="brand-logo mx-auto mb-2" style="width: 36px; height: 36px; font-size: 16px;">SP</div>
      <h2 class="fw-bold mb-1" style="font-size: 1.35rem;">StockPilot</h2>
      <p class="text-secondary small mb-0">Production Retail Management & Supply Chain BI</p>
    </div>

    <!-- Login Card -->
    <div class="sp-card">
      <div class="sp-card-body p-4">
        <!-- Error Banner -->
        <div id="error-alert" class="alert alert-danger d-none py-2 px-3 mb-3 small" role="alert"></div>

        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label small fw-semibold">Email Address</label>
            <input type="email" class="form-control form-control-sm" id="email" required placeholder="name@stockpilot.io" autocomplete="username">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small fw-semibold">Password</label>
            <input type="password" class="form-control form-control-sm" id="password" required placeholder="••••••••" autocomplete="current-password">
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 btn-sm fw-semibold">
            Sign In
          </button>
        </form>

        <div class="border-top my-3"></div>

        <!-- Fast Demo Switcher -->
        <div>
          <p class="text-secondary small text-center mb-2" style="font-size: 11.5px;">Click to autofill demo credentials:</p>
          <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-sm btn-secondary flex-fill" onclick="setDemoAccount('admin@stockpilot.io')">Admin</button>
            <button type="button" class="btn btn-sm btn-secondary flex-fill" onclick="setDemoAccount('manager@stockpilot.io')">Manager</button>
            <button type="button" class="btn btn-sm btn-secondary flex-fill" onclick="setDemoAccount('staff@stockpilot.io')">Staff</button>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center text-secondary small mt-3" style="font-size: 11.5px;">
      StockPilot Enterprise &bull; MS SQL Server 2022 &bull; XGBoost ML
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
