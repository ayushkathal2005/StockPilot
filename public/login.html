<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
  <div id="toast-container"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 login-card">
          <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
              <span class="fs-1">📦</span>
              <h2 class="fw-bold mt-2">StockPilot</h2>
              <p class="text-muted">Sign in to manage inventory & analytics</p>
            </div>

            <!-- Error Banner -->
            <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="login-form">
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email address</label>
                <input type="email" class="form-control" id="email" required placeholder="name@company.com" autocomplete="username">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••" autocomplete="current-password">
              </div>

              <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-semibold">
                Sign In
              </button>
            </form>

            <hr class="my-4">

            <!-- Demo Account Fast Selection -->
            <div>
              <p class="text-muted small text-center mb-2">Fast Demo Login (Seeded Roles):</p>
              <div class="d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemoAccount('admin@stockpilot.io')">Admin</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemoAccount('manager@stockpilot.io')">Manager</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemoAccount('staff@stockpilot.io')">Staff</button>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center text-muted small mt-3">
          StockPilot &bull; TPDS-III Integrated Enterprise System
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Check if redirect due to expired session
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired')) {
      const alert = document.getElementById('error-alert');
      alert.textContent = 'Your session has expired. Please sign in again.';
      alert.classList.remove('d-none');
    }

    function setDemoAccount(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'Password123!';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('error-alert');
      const submitBtn = document.getElementById('submit-btn');
      
      alert.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await api.post('/auth/login', { email, password });
        if (response && response.success) {
          api.setToken(response.data.token);
          auth.setUser(response.data.user);
          window.location.href = '/products.html';
        }
      } catch (err) {
        alert.textContent = err.message || 'Login failed. Please verify credentials.';
        alert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
