<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot - Categories</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container"></div>
  <div id="navbar-placeholder"></div>

  <main class="container-fluid py-4 px-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div>
        <h2 class="fw-bold mb-0">Product Categories</h2>
        <p class="text-muted mb-0">Taxonomy hierarchy and product classification structure</p>
      </div>
      <div>
        <button id="btn-add-category" class="btn btn-primary" onclick="openAddCategoryModal()">
          <span class="me-1">+</span> Add Category
        </button>
      </div>
    </div>

    <div class="card overflow-hidden">
      <div id="categories-loading" class="spinner-overlay">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading categories...</span>
        </div>
      </div>

      <div id="categories-empty" class="d-none text-center p-5">
        <h5 class="fw-semibold">No categories found</h5>
      </div>

      <div class="table-responsive">
        <table id="categories-table" class="table table-hover align-middle mb-0 d-none">
          <thead>
            <tr>
              <th>Category Name</th>
              <th>Description</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="categories-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Category Modal -->
  <div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="category-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="category-modal-title">Category</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <div id="category-error-alert" class="alert alert-danger d-none"></div>
            <input type="hidden" id="category-id">

            <div class="mb-3">
              <label class="form-label fw-semibold">Category Name *</label>
              <input type="text" id="cat-name" class="form-control" required placeholder="e.g. Beverages">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea id="cat-desc" class="form-control" rows="3" placeholder="Category description..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="save-category-btn" class="btn btn-primary fw-semibold">Save Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/categories.js"></script>
</body>
</html>
