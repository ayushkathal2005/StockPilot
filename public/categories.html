<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot — Categories</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Global Layout Wrapper -->
  <div id="app-layout">
    <div id="navbar-placeholder"></div>

    <div id="main-wrapper">
      <main id="content-area">
        <!-- Page Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
          <div>
            <h1 class="page-title">Product Categories</h1>
            <p class="page-subtitle">Taxonomy hierarchy and product classification structure</p>
          </div>
          <div>
            <button id="btn-add-category" class="btn btn-sm btn-primary" onclick="openAddCategoryModal()">
              <i data-lucide="plus"></i>
              <span>Add Category</span>
            </button>
          </div>
        </div>

        <!-- Categories Table Card -->
        <div class="sp-card">
          <div id="categories-loading" class="spinner-overlay d-none">
            <div class="spinner-border spinner-border-sm text-primary" role="status">
              <span class="visually-hidden">Loading categories...</span>
            </div>
          </div>

          <div id="categories-empty" class="d-none text-center py-5">
            <i data-lucide="folder" class="text-muted mb-2" style="width:36px;height:36px;"></i>
            <h6 class="fw-semibold text-muted">No categories found</h6>
          </div>

          <div class="table-responsive">
            <table id="categories-table" class="sp-table align-middle d-none">
              <thead>
                <tr>
                  <th style="width: 220px;">Category Name</th>
                  <th>Description</th>
                  <th style="width: 120px;">Status</th>
                  <th class="text-end" style="width: 100px;">Actions</th>
                </tr>
              </thead>
              <tbody id="categories-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Category Modal -->
  <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="category-modal-title" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="category-form">
          <div class="modal-header py-2 px-3 border-bottom">
            <h6 class="modal-title fw-bold" id="category-modal-title">Category</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-3">
            <div id="category-error-alert" class="alert alert-danger d-none py-2 px-3 mb-3 small"></div>
            <input type="hidden" id="category-id">

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="cat-name">Category Name <span class="text-danger">*</span></label>
              <input type="text" id="cat-name" class="form-control form-control-sm" required placeholder="e.g. Beverages">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold" for="cat-desc">Description</label>
              <textarea id="cat-desc" class="form-control form-control-sm" rows="3" placeholder="Category description..."></textarea>
            </div>
          </div>
          <div class="modal-footer py-2 px-3 border-top">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="save-category-btn" class="btn btn-sm btn-primary">Save Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/categories.js"></script>
</body>
</html>
